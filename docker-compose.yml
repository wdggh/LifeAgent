services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifeagent
      POSTGRES_PASSWORD: lifeagent
      POSTGRES_DB: lifeagent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeagent -d lifeagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  chroma_data:
